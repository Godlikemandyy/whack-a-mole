<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#4FC3F7" />
  <title>🐹 打地鼠</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

    :root {
      --sky1: #5BC8F5; --sky2: #A8E6FF;
      --grass1: #6DC96E; --grass2: #3E9B3F;
      --dirt1: #C8A97A; --dirt2: #9B7A50;
      --hole-dark: #1A0D05;
      --orange: #FF6B35; --orange-d: #D94E1A;
      --green: #3DBE6E; --green-d: #2A8A4E;
      --card: rgba(255,255,255,0.93);
      --shadow: rgba(0,0,0,0.18);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100dvh}
    body{
      font-family:'Nunito','Comic Sans MS',cursive;
      background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 36%,var(--grass1) 36%,var(--grass2) 100%);
      display:flex;flex-direction:column;align-items:center;
      overflow-x:hidden;overflow-y:auto;
      user-select:none;touch-action:manipulation;
      min-height:100dvh;
    }

    /* Clouds */
    .clouds{position:fixed;inset:0 0 64% 0;pointer-events:none;z-index:0;overflow:hidden}
    .cloud{position:absolute;background:#fff;border-radius:60px;opacity:.88;animation:drift linear infinite}
    .cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
    .cl1{width:110px;height:36px;top:20%;animation-duration:22s}
    .cl1::before{width:54px;height:54px;top:-27px;left:14px}
    .cl1::after{width:40px;height:40px;top:-18px;left:54px}
    .cl2{width:80px;height:28px;top:9%;animation-duration:30s;animation-delay:-11s}
    .cl2::before{width:40px;height:40px;top:-20px;left:8px}
    .cl2::after{width:30px;height:30px;top:-14px;left:38px}
    .cl3{width:140px;height:44px;top:30%;animation-duration:26s;animation-delay:-5s}
    .cl3::before{width:66px;height:66px;top:-33px;left:20px}
    .cl3::after{width:50px;height:50px;top:-22px;left:70px}
    @keyframes drift{from{left:-180px}to{left:calc(100vw+180px)}}

    /* Grass */
    .grass-layer{position:fixed;bottom:0;left:0;width:100%;height:48px;pointer-events:none;z-index:1;overflow:hidden}
    .blade{position:absolute;bottom:0;width:13px;background:var(--grass2);border-radius:50% 50% 0 0;transform-origin:bottom center;animation:sway ease-in-out infinite alternate}
    @keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

    /* Header */
    .header{position:relative;z-index:10;width:100%;max-width:480px;padding:max(env(safe-area-inset-top,10px),10px) 14px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
    .title{font-size:clamp(1.5rem,6.5vw,2.4rem);font-weight:900;color:#fff;text-shadow:0 3px 0 var(--orange),0 5px 0 var(--orange-d),0 8px 14px rgba(0,0,0,.22);letter-spacing:1px;animation:titleWobble 2.8s ease-in-out infinite}
    @keyframes titleWobble{0%,100%{transform:rotate(-1.2deg) translateY(0)}50%{transform:rotate(1.2deg) translateY(-5px)}}

    /* Scoreboard */
    .scores{display:flex;gap:8px;width:100%;justify-content:center}
    .sc{background:var(--card);border-radius:14px;padding:4px 10px 6px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.1);flex:1;max-width:100px}
    .sc-label{font-size:.65rem;font-weight:700;color:#bbb;letter-spacing:.4px}
    .sc-val{font-size:1.45rem;font-weight:900;color:var(--orange);line-height:1.1}
    #tv{color:var(--green)}
    #tv.urgent{color:#F44336;animation:pulse .45s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}

    /* Difficulty */
    .diffs{display:flex;gap:8px}
    .db{font-family:'Nunito',cursive;font-size:.8rem;font-weight:700;padding:5px 14px;border-radius:50px;border:2.5px solid transparent;cursor:pointer;background:rgba(255,255,255,.72);color:#666;transition:all .15s}
    .db.on{background:var(--orange);color:#fff;border-color:var(--orange-d)}

    /* Game area */
    .game-area{position:relative;z-index:10;width:100%;max-width:480px;flex:1;display:flex;align-items:center;justify-content:center;padding:6px 10px 0}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.8vw,16px);width:100%}

    /* Hole cell */
    .cell{position:relative;width:100%;aspect-ratio:1}
    .ground{position:absolute;bottom:0;left:0;right:0;height:56%;background:radial-gradient(ellipse at 50% 30%,var(--dirt1) 40%,var(--dirt2) 100%);border-radius:12px 12px 8px 8px;z-index:2}
    .hole-bg{position:absolute;bottom:30%;left:50%;transform:translateX(-50%);width:64%;padding-bottom:34%;background:radial-gradient(ellipse at 50% 40%,#0d0602 30%,var(--hole-dark) 100%);border-radius:50%;z-index:3;box-shadow:inset 0 4px 14px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.3)}
    .mole-clip{position:absolute;bottom:28%;left:50%;transform:translateX(-50%);width:62%;height:80%;overflow:hidden;z-index:4}
    .mole-wrap{position:absolute;bottom:0;left:0;right:0;transform:translateY(105%);transition:transform .22s cubic-bezier(.34,1.5,.64,1);cursor:pointer;touch-action:manipulation}
    .mole-wrap.up{transform:translateY(12%)}
    .mole-wrap.whacked{transform:translateY(105%);transition:transform .1s ease-in}
    .mole-inner{position:relative;width:100%}
    .mole-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}

    /* Hole front rim — on top of mole */
    .hole-rim{position:absolute;bottom:28%;left:50%;transform:translateX(-50%);width:68%;padding-bottom:22%;background:radial-gradient(ellipse at 50% 20%,var(--dirt1) 30%,var(--dirt2) 100%);border-radius:50%;z-index:5;box-shadow:0 -2px 6px rgba(0,0,0,.18)}

    /* Wrong shake */
    @keyframes wrongShake{0%,100%{transform:translateY(12%)}20%{transform:translateY(12%) translateX(7px)}40%{transform:translateY(12%) translateX(-7px)}60%{transform:translateY(12%) translateX(4px)}80%{transform:translateY(12%) translateX(-4px)}}
    .mole-wrap.wrong{animation:wrongShake .36s ease-in-out}

    /* Particles */
    .particle{position:fixed;pointer-events:none;z-index:60;animation:ptPop .7s ease-out forwards}
    @keyframes ptPop{0%{opacity:1;transform:scale(.4) translateY(0)}60%{opacity:1;transform:scale(1.3) translateY(-26px)}100%{opacity:0;transform:scale(.9) translateY(-52px)}}

    /* Buttons */
    .btn-row{position:relative;z-index:10;display:flex;gap:12px;padding:8px 14px calc(max(env(safe-area-inset-bottom,8px),8px)+6px)}
    .btn{font-family:'Nunito',cursive;font-size:clamp(1rem,4.5vw,1.25rem);font-weight:900;color:#fff;background:var(--orange);border:none;border-radius:50px;padding:12px 34px;box-shadow:0 5px 0 var(--orange-d),0 7px 16px var(--shadow);cursor:pointer;transition:transform .1s,box-shadow .1s;letter-spacing:.4px}
    .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange-d)}
    .btn.g{background:var(--green);box-shadow:0 5px 0 var(--green-d),0 7px 16px var(--shadow)}
    .btn.g:active{box-shadow:0 1px 0 var(--green-d)}

    /* Overlay */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
    .overlay.hidden{display:none}
    .modal{background:#fff;border-radius:28px;padding:30px 36px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.35);max-width:320px;width:88%;animation:mPop .4s cubic-bezier(.34,1.56,.64,1)}
    @keyframes mPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
    .m-emoji{font-size:4.2rem;margin-bottom:4px}
    .m-title{font-size:1.9rem;font-weight:900;color:var(--orange);margin-bottom:4px}
    .m-score{font-size:1.05rem;font-weight:700;color:#666;margin-bottom:18px}
    .m-score span{font-size:1.7rem;color:var(--orange)}

    /* Confetti */
    .cf{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:200;animation:cfFall linear forwards}
    @keyframes cfFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  </style>
</head>
<body>

<div class="clouds">
  <div class="cloud cl1"></div>
  <div class="cloud cl2"></div>
  <div class="cloud cl3"></div>
</div>
<div class="grass-layer" id="grassLayer"></div>

<!-- Header -->
<div class="header">
  <div class="title">🐹 打地鼠</div>

  <div class="scores">
    <div class="sc"><div class="sc-label">⭐ 得分</div><div class="sc-val" id="sv">0</div></div>
    <div class="sc"><div class="sc-label">⏱ 时间</div><div class="sc-val" id="tv">30</div></div>
    <div class="sc"><div class="sc-label">🔥 连击</div><div class="sc-val" id="cv">0</div></div>
  </div>

  <div class="diffs">
    <button class="db on" data-d="easy">🐣 简单</button>
    <button class="db"    data-d="normal">🐹 普通</button>
    <button class="db"    data-d="hard">🔥 挑战</button>
  </div>
</div>

<!-- Grid -->
<div class="game-area">
  <div class="grid" id="grid"></div>
</div>

<!-- Button -->
<div class="btn-row">
  <button class="btn g" id="startBtn">▶ 开始游戏</button>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-emoji">🐹</div>
    <div class="m-title">准备好了吗？</div>
    <div class="m-score">选好难度，点击开始！</div>
    <button class="btn g" onclick="startGame()">▶ 开始游戏</button>
  </div>
</div>

<script>
/* ===== CONFIG ===== */
const DIFF = {
  easy:   { moleMs: 2200, spawnMs: 1500, t: 30 },
  normal: { moleMs: 1500, spawnMs: 1050, t: 30 },
  hard:   { moleMs:  950, spawnMs:  680, t: 30 },
};

/* ===== MOLE DESIGNS ===== */
const HATS  = ['#E53935','#1E88E5','#43A047','#FB8C00','#8E24AA','#00ACC1','#F4511E','#039BE5'];
const BODIES= ['#795548','#5D4037','#6D4C41','#4E342E','#8D6E63','#6D4C41'];
const FACES = ['#BCAAA4','#A1887F','#D7CCC8','#BCAAA4','#A1887F','#BCAAA4'];
const NOSES = ['#F48FB1','#F06292','#FF80AB','#FF4081','#F48FB1','#F06292'];

const EXPRS = [
  `<path d="M34 54 Q50 66 66 54" stroke="#3E2723" stroke-width="3.2" fill="none" stroke-linecap="round"/>
   <circle cx="36" cy="43" r="5.5" fill="#3E2723"/><circle cx="64" cy="43" r="5.5" fill="#3E2723"/>
   <circle cx="38" cy="41" r="2" fill="white"/><circle cx="66" cy="41" r="2" fill="white"/>`,
  `<ellipse cx="50" cy="60" rx="9" ry="7.5" fill="#3E2723"/>
   <circle cx="36" cy="42" r="6.5" fill="#3E2723"/><circle cx="64" cy="42" r="6.5" fill="#3E2723"/>
   <circle cx="38" cy="40" r="2.5" fill="white"/><circle cx="66" cy="40" r="2.5" fill="white"/>`,
  `<path d="M35 53 Q50 64 65 53" stroke="#3E2723" stroke-width="3.2" fill="none" stroke-linecap="round"/>
   <circle cx="36" cy="43" r="5.5" fill="#3E2723"/>
   <path d="M57 41 Q63 36 69 41" stroke="#3E2723" stroke-width="3" fill="none" stroke-linecap="round"/>
   <circle cx="38" cy="41" r="2" fill="white"/>`,
  `<ellipse cx="50" cy="61" rx="7" ry="8.5" fill="#3E2723"/>
   <circle cx="36" cy="42" r="7" fill="#3E2723"/><circle cx="64" cy="42" r="7" fill="#3E2723"/>
   <circle cx="38" cy="40" r="3" fill="white"/><circle cx="66" cy="40" r="3" fill="white"/>`,
];

function moleSVG(i) {
  const body=BODIES[i%BODIES.length], face=FACES[i%FACES.length];
  const nose=NOSES[i%NOSES.length], hat=HATS[i%HATS.length];
  const expr=EXPRS[i%EXPRS.length];
  return `<svg class="mole-svg" viewBox="0 0 100 105" xmlns="http://www.w3.org/2000/svg">
    <rect x="28" y="8" width="44" height="22" rx="5" fill="${hat}"/>
    <rect x="20" y="26" width="60" height="9" rx="5" fill="${hat}"/>
    <ellipse cx="50" cy="86" rx="27" ry="18" fill="${body}"/>
    <ellipse cx="50" cy="55" rx="31" ry="29" fill="${face}"/>
    <ellipse cx="22" cy="37" rx="12" ry="14" fill="${body}"/>
    <ellipse cx="78" cy="37" rx="12" ry="14" fill="${body}"/>
    <ellipse cx="22" cy="37" rx="7"  ry="9"  fill="${nose}" opacity=".5"/>
    <ellipse cx="78" cy="37" rx="7"  ry="9"  fill="${nose}" opacity=".5"/>
    <ellipse cx="50" cy="62" rx="14" ry="10" fill="${body}" opacity=".4"/>
    <ellipse cx="50" cy="57" rx="6"  ry="4.5" fill="${nose}"/>
    <ellipse cx="48.5" cy="56" rx="2" ry="1.5" fill="white" opacity=".65"/>
    <line x1="16" y1="61" x2="37" y2="63" stroke="${body}" stroke-width="1.5" opacity=".6"/>
    <line x1="16" y1="67" x2="37" y2="65" stroke="${body}" stroke-width="1.5" opacity=".6"/>
    <line x1="63" y1="63" x2="84" y2="61" stroke="${body}" stroke-width="1.5" opacity=".6"/>
    <line x1="63" y1="65" x2="84" y2="67" stroke="${body}" stroke-width="1.5" opacity=".6"/>
    ${expr}
    <ellipse cx="31" cy="98" rx="10" ry="6.5" fill="${body}"/>
    <ellipse cx="69" cy="98" rx="10" ry="6.5" fill="${body}"/>
  </svg>`;
}

/* ===== STATE ===== */
let score=0, combo=0, timeLeft=30, gameRunning=false;
let diff='easy', holes=[], spawnTmr=null, countTmr=null;

/* ===== GRASS ===== */
(()=>{
  const l=document.getElementById('grassLayer');
  for(let i=0;i<38;i++){
    const b=document.createElement('div');
    b.className='blade';
    b.style.cssText=`left:${i*2.7}%;height:${20+Math.random()*24}px;animation-duration:${1.3+Math.random()}s;animation-delay:${Math.random()*2}s`;
    l.appendChild(b);
  }
})();

/* ===== BUILD GRID ===== */
function buildGrid(){
  const g=document.getElementById('grid');
  g.innerHTML=''; holes=[];
  for(let i=0;i<9;i++){
    const cell=document.createElement('div');
    cell.className='cell';

    const ground=document.createElement('div'); ground.className='ground';
    const holeBg=document.createElement('div'); holeBg.className='hole-bg';
    const clip=document.createElement('div');   clip.className='mole-clip';

    const wrap=document.createElement('div'); wrap.className='mole-wrap';
    const inner=document.createElement('div'); inner.className='mole-inner';
    inner.innerHTML=moleSVG(i);
    wrap.appendChild(inner);
    clip.appendChild(wrap);

    const rim=document.createElement('div'); rim.className='hole-rim';

    cell.appendChild(ground); cell.appendChild(holeBg);
    cell.appendChild(clip);   cell.appendChild(rim);
    g.appendChild(cell);

    wrap.addEventListener('pointerdown', e=>{ e.preventDefault(); whack(i); });
    holes.push({ wrap, active:false, timer:null });
  }
}

/* ===== GAME ===== */
function startGame(){
  hideOverlay();
  if(gameRunning) stopGame();
  score=0; combo=0; timeLeft=DIFF[diff].t;
  gameRunning=true;
  updateUI(); buildGrid();
  spawnMole();
  spawnTmr=setInterval(spawnMole, DIFF[diff].spawnMs);
  countTmr=setInterval(()=>{
    timeLeft--;
    updateUI();
    timeLeft<=5 ? document.getElementById('tv').classList.add('urgent') : document.getElementById('tv').classList.remove('urgent');
    if(timeLeft<=0) endGame();
  },1000);
}

function stopGame(){
  gameRunning=false;
  clearInterval(spawnTmr); clearInterval(countTmr);
  holes.forEach(h=>{ clearTimeout(h.timer); h.wrap.classList.remove('up','whacked','wrong'); h.active=false; });
}

function endGame(){ stopGame(); showEnd(); launchConfetti(); }

function spawnMole(){
  if(!gameRunning) return;
  const free=holes.filter(h=>!h.active);
  if(!free.length) return;
  const h=free[Math.floor(Math.random()*free.length)];
  h.active=true;
  h.wrap.classList.add('up');
  h.wrap.classList.remove('whacked','wrong');
  h.timer=setTimeout(()=>{
    if(h.active){ h.active=false; h.wrap.classList.remove('up'); combo=0; updateUI(); }
  }, DIFF[diff].moleMs);
}

function whack(i){
  if(!gameRunning) return;
  const h=holes[i];
  if(!h.active) return;
  clearTimeout(h.timer);
  h.active=false;
  h.wrap.classList.add('whacked');
  setTimeout(()=>h.wrap.classList.remove('whacked'),280);
  combo++;
  score += combo>=3 ? 2 : 1;
  updateUI();
  burst(h.wrap, combo>=3);
  if(navigator.vibrate) navigator.vibrate(35);
}

function updateUI(){
  document.getElementById('sv').textContent=score;
  document.getElementById('tv').textContent=timeLeft;
  document.getElementById('cv').textContent=combo;
}

/* ===== FX ===== */
const HIT=['⭐','💥','✨','🌟','💫','🎉'];
const BAD=['❌','💨'];

function burst(el, isCombo){
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height*.35;
  const n=isCombo?5:3;
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='particle'; p.style.fontSize='1.5rem';
    p.textContent=HIT[Math.floor(Math.random()*HIT.length)];
    const a=(i/n)*360, d=22+Math.random()*22;
    p.style.left=(cx+Math.cos(a*Math.PI/180)*d-12)+'px';
    p.style.top =(cy+Math.sin(a*Math.PI/180)*d-12)+'px';
    p.style.animationDelay=(i*.04)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),800);
  }
  const pop=document.createElement('div');
  pop.className='particle';
  pop.style.cssText=`font-size:1.2rem;font-weight:900;color:${isCombo?'#FF6B35':'#FFD600'};text-shadow:0 2px 4px rgba(0,0,0,.4);left:${cx-18}px;top:${cy-34}px`;
  pop.textContent=isCombo?'+2 连击!':'+1';
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),720);
}

function wrongFx(el){
  const r=el.getBoundingClientRect();
  const p=document.createElement('div');
  p.className='particle'; p.style.fontSize='1.7rem';
  p.textContent=BAD[Math.floor(Math.random()*BAD.length)];
  p.style.left=(r.left+r.width/2-14)+'px';
  p.style.top =(r.top+r.height*.35-14)+'px';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),720);
}

function launchConfetti(){
  const cols=['#FF6B35','#FFD600','#43A047','#4FC3F7','#F48FB1','#CE93D8'];
  for(let i=0;i<55;i++){
    const c=document.createElement('div');
    c.className='cf';
    c.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%cols.length]};animation-duration:${1.4+Math.random()*2}s;animation-delay:${Math.random()*.8}s;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3500);
  }
}

/* ===== OVERLAY ===== */
function hideOverlay(){ document.getElementById('overlay').classList.add('hidden'); }

function showEnd(){
  let em,msg;
  if(score===0)     {em='😅';msg='没打到？再试试！';}
  else if(score<5)  {em='🐹';msg='不错哦，继续！';}
  else if(score<10) {em='⭐';msg='太棒了！';}
  else if(score<15) {em='🌟';msg='超级厉害！';}
  else              {em='🏆';msg='打地鼠大师！';}
  document.getElementById('overlay').querySelector('.m-emoji').textContent=em;
  document.getElementById('overlay').querySelector('.m-title').textContent=msg;
  document.getElementById('overlay').querySelector('.m-score').innerHTML=`打了 <span>${score}</span> 只地鼠！`;
  const b=document.getElementById('overlay').querySelector('.btn');
  b.textContent='🔄 再玩一次'; b.onclick=startGame;
  document.getElementById('overlay').classList.remove('hidden');
}

/* ===== DIFFICULTY ===== */
document.querySelectorAll('.db').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.db').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); diff=b.dataset.d;
  });
});
document.getElementById('startBtn').addEventListener('click', startGame);

buildGrid();
</script>
</body>
</html>
